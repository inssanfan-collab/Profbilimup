services:
    app:
        build:
            context: .
            dockerfile: docker/production/Dockerfile
        image: profbilimup-app:latest
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - '.:/var/www/html'
        env_file: .env
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - app

    queue:
        build:
            context: .
            dockerfile: docker/production/Dockerfile
        image: profbilimup-app:latest
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        volumes:
            - '.:/var/www/html'
        env_file: .env
        depends_on:
            - app
        networks:
            - app

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - '5003:80'
        volumes:
            - '.:/var/www/html:ro'
            - './docker/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
        depends_on:
            - app
        networks:
            - app

    pgsql:
        image: 'postgres:16-alpine'
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'pgsql-data:/var/lib/postgresql/data'
        networks:
            - app
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: 'redis:7-alpine'
        restart: unless-stopped
        volumes:
            - 'redis-data:/data'
        networks:
            - app
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

networks:
    app:
        driver: bridge

volumes:
    pgsql-data:
        driver: local
    redis-data:
        driver: local
